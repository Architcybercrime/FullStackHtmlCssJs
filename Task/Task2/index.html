<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> E-Commerce Listing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563EB; --sale: #DC2626; --heading: #111827;
      --body: #6B7280; --bg: #F9FAFB; --border: #E5E7EB; --rating: #F59E0B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--body); font-size: 14px; }

    .app-container { max-width: 1100px; margin: 24px auto; padding: 0 20px; display: flex; gap: 24px; }
    .sidebar { width: 240px; flex-shrink: 0; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 16px; height: fit-content; }
    .sidebar h4 { margin-bottom: 8px; color: var(--heading); }
    .filter-group { margin-bottom: 16px; }
    .filter-group label { display: block; margin-bottom: 6px; cursor: pointer; }
    .reset-btn { width: 100%; padding: 8px; border: 1px solid var(--border); background: #f3f4f6; border-radius: 4px; cursor: pointer; font-weight: 600; }
    
    .catalog { flex: 1; }
    .catalog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .catalog-header h2 { font-size: 18px; color: var(--heading); }
    
    .product-grid { display: grid; gap: 24px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .card-media { position: relative; height: 180px; background: #f3f4f6; }
    .card-media img { width: 100%; height: 100%; object-fit: cover; }
    .sale-badge { position: absolute; top: 10px; left: 10px; background: var(--sale); color: #fff; font-size: 11px; padding: 3px 6px; border-radius: 4px; font-weight: 600; }
    .wishlist-btn { position: absolute; top: 8px; right: 8px; background: #fff; border-radius: 50%; width: 30px; height: 30px; border: none; cursor: pointer; color: #9CA3AF; font-size: 16px; }
    .wishlist-btn.active { color: var(--sale); }
    
    .card-body { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-body .category { font-size: 13px; text-transform: uppercase; margin-bottom: 4px; font-weight: 400; }
    .card-body .title { font-size: 16px; font-weight: 600; color: var(--heading); margin-bottom: 8px; min-height: 42px; line-height: 1.4; }
    .card-body .rating { margin-bottom: 8px; font-size: 13px; }
    .card-body .rating .stars { color: var(--rating); }
    .card-body .price-info { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
    .card-body .price { font-size: 20px; font-weight: 700; color: var(--heading); }
    .card-body .old-price { font-size: 14px; text-decoration: line-through; }
    .add-to-cart { margin-top: auto; width: 100%; background: var(--primary); color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .add-to-cart.added { background-color: #10B981; }

    @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 640px) and (max-width: 1023px) {
      .app-container { flex-direction: column; } .sidebar { width: 100%; } .product-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 639px) {
      .app-container { flex-direction: column; } .sidebar { width: 100%; } .product-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <h4>Category</h4>
      <div class="filter-group">
        <label><input type="radio" name="category" value="all" checked> All</label>
        <label><input type="radio" name="category" value="audio"> Audio</label>
        <label><input type="radio" name="category" value="wearables"> Wearables</label>
      </div>
      <h4>Offers</h4>
      <div class="filter-group">
        <label><input type="checkbox" id="on-sale"> On Sale Only</label>
      </div>
      <button class="reset-btn" id="reset-filters">Reset</button>
    </aside>

    <main class="catalog">
      <div class="catalog-header">
        <h2>Featured Products</h2>
        <span id="item-count">Showing 4 items</span>
      </div>

      <div class="product-grid" id="product-grid">
        <div class="card" data-category="audio" data-sale="true">
          <div class="card-media">
            <span class="sale-badge">SALE</span>
            <button class="wishlist-btn">♥</button>
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" alt="Headphones">
          </div>
          <div class="card-body">
            <span class="category">Audio</span>
            <h3 class="title">Studio Headphones</h3>
            <div class="rating"><span class="stars">★★★★☆</span> (12)</div>
            <div class="price-info"><span class="price">$199</span><span class="old-price">$249</span></div>
            <button class="add-to-cart">Add to Cart</button>
          </div>
        </div>

        <div class="card" data-category="wearables" data-sale="false">
          <div class="card-media">
            <button class="wishlist-btn">♥</button>
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" alt="Smart Watch">
          </div>
          <div class="card-body">
            <span class="category">Wearables</span>
            <h3 class="title">Fitness Smartwatch</h3>
            <div class="rating"><span class="stars">★★★★★</span> (48)</div>
            <div class="price-info"><span class="price">$149</span></div>
            <button class="add-to-cart">Add to Cart</button>
          </div>
        </div>

        <div class="card" data-category="audio" data-sale="true">
          <div class="card-media">
            <span class="sale-badge">SALE</span>
            <button class="wishlist-btn">♥</button>
            <img src="https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=400" alt="Earbuds">
          </div>
          <div class="card-body">
            <span class="category">Audio</span>
            <h3 class="title">Wireless Earbuds</h3>
            <div class="rating"><span class="stars">★★★★☆</span> (19)</div>
            <div class="price-info"><span class="price">$79</span><span class="old-price">$99</span></div>
            <button class="add-to-cart">Add to Cart</button>
          </div>
        </div>

        <div class="card" data-category="wearables" data-sale="false">
          <div class="card-media">
            <button class="wishlist-btn">♥</button>
            <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=400" alt="Fitness Tracker">
          </div>
          <div class="card-body">
            <span class="category">Wearables</span>
            <h3 class="title">Activity Tracker Band</h3>
            <div class="rating"><span class="stars">★★★★☆</span> (31)</div>
            <div class="price-info"><span class="price">$59</span></div>
            <button class="add-to-cart">Add to Cart</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const productCards = document.querySelectorAll('.card');
      const categoryFilters = document.querySelectorAll('input[name="category"]');
      const saleFilter = document.getElementById('on-sale');
      const itemCountDisplay = document.getElementById('item-count');

      const applyFilters = () => {
        const selectedCategory = document.querySelector('input[name="category"]:checked').value;
        const showSalesOnly = saleFilter.checked;
        let visibleCount = 0;

        productCards.forEach(card => {
          const cardCategory = card.dataset.category;
          const isSaleItem = card.dataset.sale === 'true';

          const categoryMatch = selectedCategory === 'all' || cardCategory === selectedCategory;
          const saleMatch = !showSalesOnly || isSaleItem;

          if (categoryMatch && saleMatch) {
            card.style.display = 'flex';
            visibleCount++;
          } else {
            card.style.display = 'none';
          }
        });
        itemCountDisplay.textContent = `Showing ${visibleCount} items`;
      };

      categoryFilters.forEach(radio => radio.addEventListener('change', applyFilters));
      saleFilter.addEventListener('change', applyFilters);

      document.getElementById('reset-filters').addEventListener('click', () => {
        document.querySelector('input[name="category"][value="all"]').checked = true;
        saleFilter.checked = false;
        applyFilters();
      });

      document.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const button = e.target;
          button.textContent = 'Added!';
          button.classList.add('added');
          setTimeout(() => {
            button.textContent = 'Add to Cart';
            button.classList.remove('added');
          }, 1000);
        });
      });
        
      document.querySelectorAll('.wishlist-btn').forEach(btn => {
        btn.addEventListener('click', () => btn.classList.toggle('active'));
      });

      applyFilters();
    });
  </script>
</body>
</html>
