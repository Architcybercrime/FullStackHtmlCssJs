<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards</title>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;    
            align-items: center;
            height: 100vh;
        }
        .product-card {
            background-color: #3b77c0;
            align-items: center;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 10px rgba(182, 92, 92, 0.1);
            margin: 10px;
            height: 200px;
        }
        .button {
            background-color: #fff;
            color: #5488d5;
            border: 2px solid #0c1017;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class = "container">
        <div class = "product-card">
            <h2>Product 1</h2>
            <p align="center">19.99</p>
            <button class="button" align="center">Buy Now</button>
        </div>

        <div class = "product-card">
            <h2>Product 2</h2>
            <p align="center">29.99</p>
            <button class="button" align="center">Buy Now</button>
        </div>

        <div class = "product-card">
            <h2>Product 3</h2>
            <p align="center">39.99</p>
            <button class="button" align="center">Buy Now</button>
        </div>

</body>
</html>
