<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Paragraph Example</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Crushed&display=swap" rel="stylesheet">
        <style>
            :root{--page-bg:#fff7ec;--card-bg:#fff;--accent:#ff5c7c}
            *{box-sizing:border-box}
            html,body{height:100%}
            body{
                margin:0;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background:var(--page-bg);
                color:#222;
                display:flex;
                align-items:center;
                justify-content:center;
                padding:28px;
            }
            .container{
                width:100%;
                max-width:760px;
                background:rgba(255,255,255,0.95);
                padding:24px;
                border-radius:12px;
                box-shadow:0 10px 30px rgba(30,40,80,0.12);
            }
            h1{
                font-family:'Crushed', Georgia, serif;
                font-size:34px;
                margin:0 0 10px 0;
                text-align:center;
                color:var(--accent);
                letter-spacing:0.5px;
            }
            img{display:block;margin:14px auto;border-radius:8px;max-width:100%;height:auto;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
            p{font-size:16px;line-height:1.6;margin:0 0 12px 0;color:#222;padding:8px;border-radius:8px;}
            @media (max-width:420px){
                .container{padding:14px}
                h1{font-size:24px}
            }
        </style>
    </head>
    <body>
        <main class="container">
            <h1>Honda Rebel 300</h1>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVlVMz9FafBLSkK8636EhbYdpfu6UzIxCqElWzdR3geQ&s" alt="Honda Rebel 300 motorcycle, side view">
            <p>Wroooom wrooooooom worrooooooom bike goesss wrooooooom wroooooom</p>
            <p>T Gadi pe maru gedi ghoomu duniya puri</p>
        </main>
    </body>
</html>
