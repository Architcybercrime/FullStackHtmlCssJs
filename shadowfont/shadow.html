<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow</title>
    <style>
        @font-face {
            font-family: 'GeraldinePersonalUseItalic';
            src: url("./GeraldinePersonalUseItalic-PK12m.ttf");
        }
        p1{
            box-shadow: 10px 10px 5px grey;
            width: 300px;
            text-align: center;
        }
        p2{
            font-size: 20px;
            font-family: 'GeraldinePersonalUseItalic', sans-serif;
            font-weight: bold;
            font-style: italic;
            letter-spacing: 2px;
            line-height: 1.5;
            text-decoration: underline;
            text-decoration: line-through;
            text-transform: uppercase;
        }
        img{
            width: 300px;
            height: 300px;
            box-shadow: 10px 10px 5px grey;
        }
    </style>
</head>
<body>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTm3sNwYrDL7vobPveYs8PyaDXdK2qq1yQ82RsDXCE16g&amp;s=10" alt="Image">
    <p1>Duniya Makkar</p1>
    <p2>text random</p2>
</body>
</html>
