<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encore Watchparty</title>
</head>

<body class="min-h-screen bg-gray-100 p-10 dark:bg-gray-950">

    <div class="mx-auto max-w-2xl">

        <!-- Theme Toggle -->
        <div class="mb-8 text-center">
            <button
                id="theme-toggle"
                type="button"
                class="rounded-lg bg-gray-900 px-5 py-3 font-medium text-white hover:bg-gray-700 dark:bg-white dark:text-gray-900 dark:hover:bg-gray-200"
            >
                Enter battlefield
            </button>
        </div>


        <!-- ChitChat Card -->
        <div
            class="mx-auto flex max-w-sm items-center gap-x-4 rounded-card bg-white p-6 shadow-lg outline outline-black/5 dark:bg-slate-800"
        >

            <img
                class="size-12 shrink-0 rounded-full"
                src="/img/logo.png"
                alt="ChitChat Logo"
            >

            <div>
                <div
                    class="font-heading text-xl font-medium text-black dark:text-white"
                >
                    We are in the end game now!
                </div>

                <p class="text-gray-500 dark:text-gray-400">
                    On your left!!
                </p>
            </div>

        </div>


        <!-- Primary Button -->
        <div class="mt-8 text-center">
            <button
                class="rounded-card bg-primary px-5 py-3 font-semibold text-white hover:bg-blue-700"
            >
                Avengers, Assemble!
            </button>
        </div>


        <!-- Grid -->
        <div class="mt-8 grid grid-cols-2 gap-4 sm:grid-cols-3">

            <div class="rounded-card bg-white p-5 text-center shadow dark:bg-gray-800 dark:text-white">
                Item 1
            </div>

            <div class="rounded-card bg-white p-5 text-center shadow dark:bg-gray-800 dark:text-white">
                Item 2
            </div>

            <div class="rounded-card bg-white p-5 text-center shadow dark:bg-gray-800 dark:text-white">
                Item 3
            </div>

            <div class="rounded-card bg-white p-5 text-center shadow dark:bg-gray-800 dark:text-white">
                Item 4
            </div>

            <div class="rounded-card bg-white p-5 text-center shadow dark:bg-gray-800 dark:text-white">
                Item 5
            </div>

            <div class="rounded-card bg-white p-5 text-center shadow dark:bg-gray-800 dark:text-white">
                Item 6
            </div>

        </div>


        <!-- Theme Card -->
        <div
            class="mt-8 rounded-card bg-white px-6 py-8 shadow-xl ring-1 ring-gray-900/5 dark:bg-gray-800"
        >

            <span
                class="inline-flex items-center justify-center rounded-md bg-secondary p-2 shadow-lg"
            >
                <svg
                    class="h-6 w-6 text-white"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    aria-hidden="true"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 6v6l4 2"
                    />
                </svg>
            </span>

            <h3
                class="mt-5 font-heading text-base font-medium tracking-tight text-gray-900 dark:text-white"
            >
                Cover the boy!
            </h3>

            <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
                The end is near, but we can still win this battle. Let's fight together
            </p>

        </div>


        <!-- Accent Button -->
        <div class="mt-8 text-center">
            <button
                class="rounded-card bg-accent px-5 py-3 font-semibold text-white"
            >
                I am inevitable
            </button>
        </div>

    </div>


    <script type="module" src="/src/main.js"></script>

</body>

</html>
