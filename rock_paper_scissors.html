<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock Paper Scissors</h1>

    <p id="status">Choose your move.</p>

    <button data-level="easy">Easy</button>
    <button data-level="medium" class="active">Medium</button>
    <button data-level="hard">Hard</button>

    <p>
        <button data-choice="Paththarr">Paththarr</button>
        <button data-choice="Kaagaz">Kaagaz</button>
        <button data-choice="Kenchiiii">Kenchiiii</button>
    </p>

    <p id="result"></p>
    <p>You: <span id="player-score">0</span></p>
    <p>Computer: <span id="computer-score">0</span></p>

    <script src="rock_paper_scissors.js"></script>
</body>
</html>
