<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Dashboard</title>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;  
            align-items: center;
            height: 100vh;
        }
        .sidebar {
            background-color: #0f3f7a;
            padding: 20px;
            border-radius: 5px;
            color: white;
            box-shadow: 0 2px 10px rgba(182, 92, 92, 0.1);
            align-items: left;
            margin: 10px;
            height: 100vh;
        }
        .main-content {
            background-color: #88a7d4;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 10px rgba(182, 92, 92, 0.1);
            margin: 10px;
            height: 200px;
        }
        .Notification Bar {
            background-color: #57677b;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 10px rgba(182, 92, 92, 0.1);
            margin: 10px;
            height: 200px;
        }

    </style>
</head>
<body>
    <div class = "container">
        <div class = "sidebar">
            <h2>Sidebar</h2>
            <ul>
                <li>Home</li>
                <li>Profile</li>
                <li>Settings</li>
                <li>Logout</li>
            </ul>
        </div>
        <div class = "main-content">
            <h1>Welcome to the Dashboard</h1>
            <p>This is the main content area.</p>
        </div>
        <div class = "Notification Bar">
            <h2>Notification Bar</h2>
            <ul>
                <li>Notification 1</li>
                <li>Notification 2</li>
                <li>Notification 3</li>
            </ul>
        </div>
    </div>

</body>
</html>
