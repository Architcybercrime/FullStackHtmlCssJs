<!DOCTYPE html>
<head>
    <style>
        .container{
            display: grid;
            height: 100vh;
            width: 200vh;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            outline: 1px solid black;
            gap: 10px;
            overflow: hidden;
        }
        .parent{
            --primary-color: black;
            display: grid;
            background-color: blue;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            grid-column: 1/3;
            grid-row: 1/3;

        }
        .child{
            background-color: var(--primary-color);
            color: white;
            grid-column: 2/3;
            grid-row: 2/3;
        }
        .container>div{
            font-size: 30px;
            outline: 1px solid black;
            outline-offset: -5px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        #box1{
            background-color: red;
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 3;
        }
        #box2{
            background-color: blue;
        }
        #box3{
            background-color: green;
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 2;
            grid-row-end: 3;
        }
        #box4{
            background-color: yellow;
        }
        #box5{
            background-color: purple;
        }
        #box6{
            background-color: orange;
        }
        #box7{
            background-color: pink;
        }   
    </style>
</head>
<body>
    <div class="container">
        <div class = "parent" id = "box1" >1</div>
        <div id = "box2" >2</div>
        <div id = "box3" >3</div>
        <div id = "box4" >4</div>
        <div id = "box5" >5</div>
        <div id = "box6" >6</div>
        <div class = "child" id = "box7" >7</div>
    </div>
</body>
</html>
