<!DOCTYPE html>
<html lang="en">
    <head> 
        <title> Document </title>
        <style>
            section h2{
                color: rgb(12, 110, 34);
            }
            section>h2{
                color: rgb(23, 16, 169);
            }
            h2+p{
                font-size: 35px;
                color: rgb(169, 16, 16);
            }
            h2~p{
                font-size: 30px;
                color: rgb(16, 169, 169);
            }
        </style>
    </head>
    <body>
        <section>
            <h2>Section Heading</h2>
            <p>Paragraph 1</p>
            <p>Paragraph 2</p>
            <div>
                <h2>Div Heading</h2>            
            </div>
        </section>
    </body>
</html>
