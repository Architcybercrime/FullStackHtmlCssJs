<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Flexbox</title>
        <style>
            .container {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                height: 100vh;
                width: 100%;
                align-items: center;
            }
            .container > div {
                color: rgb(145, 24, 24);
                text-align: center;
                padding: 20px;
            }

            .item1{
                background-color: rgb(17, 76, 170);
                flex-grow: 1;
                /*flex-shrink: 0;*/
            }
            .item2{
                background-color: rgb(27, 159, 42);
                flex-grow: 1;
                /*flex-shrink: 0;*/
            }
            .item3{
                background-color: rgb(17, 76, 170);
                flex-grow: 1;
                /*flex-shrink: 0;*/
            }

        </style>
    </head>
    <body>
        <div class="container">
            <div class="item1"> 1</div>
            <div class="item2"> 2</div>
            <div class="item3"> 3</div>
        </div>
    </body>
</html>
